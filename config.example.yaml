line:
  url: "ws://127.0.0.1:3789/api/ws"
  token: ""
  chats: []
  ownMemberIds: {}
  textMaxLength: 8000
  sendsPerMinute: 20
  # 包含處理中的訊息；超限時淘汰最舊的等待訊息，不中斷處理中的工作。
  maxPendingPerChat: 50
  maxPendingTotal: 200

# 主要供應商：openai 或 claude。另一段有設定時作為備用，主要供應商失敗時自動改用。
# 省略時有 openai 段就用 openai，否則用 claude。
provider: "openai"

openai:
  apiKey: ""
  model: "gpt-6-luna"
  # 省略時使用模型預設值；gpt-6-luna 支援 none，回覆最快。
  reasoningEffort: "none"
  contextTokens: 100000
  maxOutputTokens: 4096
  timeoutMs: 60000
  imageModel: "gpt-image-2.5-flare"
  # low、medium、high、xhigh、max 或 auto；越高越慢。
  imageQuality: "medium"
  imageTimeoutMs: 120000

# 備用；不需要時可整段刪除。
claude:
  apiKey: ""
  model: "claude-haiku-5-5"
  contextTokens: 100000
  maxOutputTokens: 4096
  timeoutMs: 60000

personalityFile: "personality.md"

# PDF 附件與圖片中的文字需要 CJK 字型。省略時自動尋找系統的 Noto Sans CJK（Debian/Ubuntu：apt install fonts-noto-cjk）
# 或 macOS 的 Hiragino Sans GB；都找不到時 PDF 停用。字型集合（.ttc／.otc）必須指定 PostScript 名稱。
# cjkFont:
#   file: "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
#   name: "NotoSansCJKtc-Regular"
