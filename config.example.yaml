line:
  url: "ws://127.0.0.1:3789/api/ws"
  token: ""
  chats: []
  ownMemberIds: {}
  textMaxLength: 8000
  sendsPerMinute: 20
  # 包含處理中的訊息；超限時淘汰最舊的等待訊息，不中斷處理中的工作。
  maxPendingPerChat: 50
  maxPendingTotal: 200

claude:
  apiKey: ""
  model: "claude-haiku-5-5"
  contextTokens: 100000
  maxOutputTokens: 4096
  timeoutMs: 60000

personalityFile: "personality.md"

# PDF 附件需要嵌入 CJK 字型。省略時自動尋找系統的 Noto Sans CJK（Debian/Ubuntu：apt install fonts-noto-cjk）
# 或 macOS 的 Hiragino Sans GB；都找不到時 PDF 停用。字型集合（.ttc／.otc）必須指定 PostScript 名稱。
# pdfFont:
#   file: "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
#   name: "NotoSansCJKtc-Regular"
